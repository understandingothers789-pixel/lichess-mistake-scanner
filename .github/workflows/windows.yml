name: Windows verification

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
  workflow_dispatch:
    inputs:
      live_engine:
        description: Download and test the current official Windows development build
        type: boolean
        default: true
      compile_engine:
        description: Build native Stockfish using MSYS2 once
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  app:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install fixed Windows dependencies
        run: .\scripts\setup-windows.ps1
      - name: Test app and package
        run: .\scripts\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SecondLook-windows-x64
          path: dist/SecondLook-windows-x64.zip
      - name: Validate official engine install, reuse and UCI
        if: startsWith(github.ref, 'refs/tags/v') || inputs.live_engine || inputs.compile_engine
        run: .\.venv\Scripts\python.exe scripts/windows-engine-check.py
      - name: Install an isolated build toolchain on the runner
        if: inputs.compile_engine
        uses: msys2/setup-msys2@v2
        id: msys
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc
          location: D:\sf-msys
      - name: Compile and validate native Stockfish
        if: inputs.compile_engine
        run: .\.venv\Scripts\python.exe scripts/windows-engine-check.py --compile --msys "${{ steps.msys.outputs.msys2-location }}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SecondLook-windows-x64
          path: release
      - name: Publish the Windows ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$env:RELEASE_TAG" release/SecondLook-windows-x64.zip --verify-tag --title "Second Look $env:RELEASE_TAG" --notes-file CHANGELOG.md
