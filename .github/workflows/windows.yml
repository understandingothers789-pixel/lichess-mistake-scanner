name: Windows verification

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
  workflow_dispatch:
    inputs:
      live_engine:
        description: Download and test the current official Windows development build
        type: boolean
        default: true
      pgo_engine:
        description: Exercise the profile-guided Stockfish build
        type: boolean
        default: false
      compile_engine:
        description: Build native Stockfish using MSYS2 once
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  app:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install fixed Windows dependencies
        env:
          BUNDLE_MAIA: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: .\scripts\setup-windows.ps1 -WithMaia:($env:BUNDLE_MAIA -eq 'true')
      - name: Test app and package
        env:
          BUNDLE_MAIA: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: .\scripts\build-windows.ps1 -WithMaia:($env:BUNDLE_MAIA -eq 'true')
      - name: Verify the bundled Maia worker
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $checkpoint = Join-Path $env:RUNNER_TEMP 'maia3-79m.pt'
          $report = Join-Path $env:RUNNER_TEMP 'maia-check.json'
          & .\.venv\Scripts\python.exe -m mistake_scanner maia-download --destination $checkpoint
          if ($LASTEXITCODE -ne 0) { throw 'Checkpoint verification failed.' }
          $arguments = 'check-maia "{0}" --report "{1}"' -f $checkpoint, $report
          $version = & .\.venv\Scripts\python.exe -c "from mistake_scanner import __version__; print(__version__)"
          $pieces = Get-ChildItem ".\dist\SecondLook-v$version\_internal\mistake_scanner\assets\merida" -Filter '*.svg'
          if ($pieces.Count -ne 12) { throw 'The packaged board is missing piece artwork.' }
          $process = Start-Process ".\dist\SecondLook-v$version\SecondLook.exe" -ArgumentList $arguments -PassThru
          if (-not $process.WaitForExit(240000)) {
              $process.Kill()
              throw 'The packaged Maia check timed out.'
          }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Bundled Maia inference failed.' }
          Get-Content $report
      - uses: actions/upload-artifact@v4
        with:
          name: SecondLook-windows-x64
          path: dist/SecondLook-windows-x64.zip
      - name: Validate official engine install, reuse and UCI
        if: startsWith(github.ref, 'refs/tags/v') || inputs.live_engine || inputs.compile_engine
        run: .\.venv\Scripts\python.exe scripts/windows-engine-check.py
      - name: Install an isolated build toolchain on the runner
        if: inputs.compile_engine || inputs.pgo_engine
        uses: msys2/setup-msys2@v2
        id: msys
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc
          location: D:\sf-msys
      - name: Compile and validate native Stockfish
        if: inputs.compile_engine || inputs.pgo_engine
        env:
          ENABLE_PGO: ${{ inputs.pgo_engine }}
        run: |
          $options = @()
          if ($env:ENABLE_PGO -eq 'true') { $options += '--pgo' }
          .\.venv\Scripts\python.exe scripts/windows-engine-check.py @options --compile --msys "${{ steps.msys.outputs.msys2-location }}"

  source:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test the extracted Python source download
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $folder = "SecondLook-Python-v$version"
          git archive --format=zip "--prefix=$folder/" -o SecondLook-Python.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive creation failed.' }
          Expand-Archive SecondLook-Python.zip -DestinationPath source-check
          "SECOND_LOOK_SOURCE=source-check/$folder" >> $env:GITHUB_ENV
          Push-Location "source-check/$folder"
          python launch.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Source launch failed.' }
          Pop-Location
      - name: Test in-app Maia installation and inference in the Python edition
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ env.SECOND_LOOK_SOURCE }}
        run: |
          $python = '.\.venv\Scripts\python.exe'
          & $python -c "from mistake_scanner.maia import install_cpu_runtime; install_cpu_runtime(print)"
          if ($LASTEXITCODE -ne 0) { throw 'In-app Maia runtime installation failed.' }
          $checkpoint = Join-Path $env:RUNNER_TEMP 'source-maia3-79m.pt'
          & $python -m mistake_scanner maia-download --destination $checkpoint
          if ($LASTEXITCODE -ne 0) { throw 'Checkpoint download failed.' }
          & $python -m mistake_scanner check-maia $checkpoint
          if ($LASTEXITCODE -ne 0) { throw 'Source Maia inference failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: SecondLook-Python
          path: SecondLook-Python.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [app, source]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SecondLook-windows-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: SecondLook-Python
          path: release
      - name: Publish Windows downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$env:RELEASE_TAG" release/SecondLook-windows-x64.zip release/SecondLook-Python.zip --verify-tag --title "Second Look $env:RELEASE_TAG" --notes-file CHANGELOG.md
